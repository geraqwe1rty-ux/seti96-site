<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Доставка заявки Сети96</title><script>
'use strict';
const parentOrigin='https://uslugi.seti96.ru';
let sending=false;
window.addEventListener('message',async event=>{
  if(event.origin!==parentOrigin||event.source!==parent||event.data?.type!=='uslugi-lead'||sending)return;
  const {id,payload}=event.data;
  if(typeof id!=='string'||id.length>100||!payload||payload.consent!==true||payload.website||!/^\+7\d{10}$/.test(payload.phone||''))return;
  sending=true;
  try{
    const response=await fetch('https://seti96-engineering.german123312.chatgpt.site/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(20000)});
    const result=await response.json();
    parent.postMessage({type:'uslugi-lead-result',id,ok:response.ok&&result.ok===true},parentOrigin);
  }catch{parent.postMessage({type:'uslugi-lead-result',id,ok:false},parentOrigin)}
  finally{sending=false}
});
parent.postMessage({type:'uslugi-relay-ready'},parentOrigin);
</script></html>
